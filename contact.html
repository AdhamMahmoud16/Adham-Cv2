<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Adham Mahmoud - CS student CV website: skills, blogs and contact.">
  <title>Contact - Adham CV</title>
  <link rel="stylesheet" href="Stylesheet.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="navbar">
    <a class="logo" href="index.html">Adham CV</a>
    <nav aria-label="Main">
      <ul class="links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="components.html">Components</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main id="main">
    <h1>Contact me</h1>
    <p>Fields marked required must be filled in.</p>
    <form class="form" action="#" method="get">
      <div class="field">
        <label for="name">Name <span class="required">(required)</span></label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email <span class="required">(required)</span></label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel">
      </div>
      <div class="field">
        <label for="date">Preferred date</label>
        <input type="date" id="date" name="date">
      </div>

      <fieldset>
        <legend>Gender</legend>
        <div class="choice">
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">Male</label>
        </div>
        <div class="choice">
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Female</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Skills</legend>
        <div class="choice">
          <input type="checkbox" id="html" name="skills" value="html">
          <label for="html">HTML</label>
        </div>
        <div class="choice">
          <input type="checkbox" id="css" name="skills" value="css">
          <label for="css">CSS</label>
        </div>
        <div class="choice">
          <input type="checkbox" id="java" name="skills" value="java">
          <label for="java">Java</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="course">Choose a course</label>
        <select id="course" name="course">
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="java">Java</option>
          <option value="cpp">C++</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5"></textarea>
      </div>

      <button type="submit" class="btn">Send message</button>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 Adham Mahmoud</p>
  </footer>
</body>
</html>
